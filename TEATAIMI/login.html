<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Teataimi</title>
  <link rel="stylesheet" href="style.css">
  <script src="auth.js" defer></script>
</head>
<body>

<header class="nav">
  <div class="nav-inner">
    <div class="brand">
      <img src="images/logo.png" alt="Teataimi Logo" class="brand-logo-img">
      <span class="brand-name">Teataimi</span>
    </div>

    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="menu.html">Menu</a>
      <a href="about.html">About</a>
      <a href="track.html">Track Order</a>

      <a id="nav-login" href="login.html">Login</a>
      <a id="nav-register" href="register.html">Register</a>
      <a id="nav-logout" href="#" onclick="logoutUser()" style="display:none;">Logout</a>
    </div>
  </div>
</header>

<main class="centered-page">
  <div class="auth-box">
    <h2>Welcome back</h2>

    <!-- keep form id/login input ids for auth.js -->
    <form id="login-form" class="auth-form" onsubmit="loginUser(event)">
      <label for="login-email">Email</label>
      <input id="login-email" type="email" required placeholder="you@example.com">

      <label for="login-password">Password</label>
      <input id="login-password" type="password" required placeholder="••••••••">

      <button class="btn btn-primary" type="submit">Login</button>

      <p class="muted" style="text-align:center; margin-top:12px;">
        Don't have an account? <a href="register.html">Register</a>
      </p>
    </form>
  </div>
</main>

<!-- FOOTER -->
<footer class="footer">
  <div class="footer-inner">
    <div class="footer-left">
      <div class="brand">
        <span class="brand-name">Teataimi</span>
      </div>
      <p class="muted">Delicious desserts • Local humble dessert shop</p>
    </div>

    <div class="footer-block">
    <strong>Contact Us</strong><br>
    
    <!-- Instagram Link -->
    <a href="https://instagram.com/teataimi" target="_blank" style="display:flex; align-items:center; gap:5px; text-decoration:none; color:#4b3d2f; margin-bottom:5px;">
        <img src="images/instagram.avif" alt="Instagram" style="width:20px; height:20px;">
        teataimi
    </a>
    
    <!-- WhatsApp Link -->
    <a href="https://wa.me/601168325354" target="_blank" style="display:flex; align-items:center; gap:5px; text-decoration:none; color:#4b3d2f; margin-bottom:5px;">
        <img src="images/whatsapp.avif" alt="WhatsApp" style="width:20px; height:20px;">
        +60 116832 5354
    </a>
   </div>
  </div>

  <div class="copy">© 2025 Teataimi. All rights reserved.</div>
</footer>

<script defer src="auth.js"></script>
</body>
</html>
