<main class="centered-page">

<script defer src="auth.js"></script>

<script>
/* ------------------------------------------
   TRACK ORDER by tracking number ONLY
------------------------------------------ */
document.getElementById("track-form").addEventListener("submit", function(e){
  e.preventDefault();

  let id = document.getElementById("track-id").value.trim();
  let orders = JSON.parse(localStorage.getItem("orders")) || [];

  let found = orders.find(o => o.orderNo === id);

  let out = document.getElementById("track-result");

  if (!found) {
    out.innerHTML = "<p>❌ Order not found</p>";
    return;
  }

  out.innerHTML = `
    <h3>Order ${found.orderNo}</h3>
    <p><strong>Status:</strong> ${found.status}</p>
    <p><strong>Date:</strong> ${found.date}</p>
    <p><strong>Name:</strong> ${found.name}</p>
    <p><strong>Method:</strong> ${found.option}</p>
  `;
});
</script>

</body>
