<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Checkout | Teataimi</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<header class="nav">
  <div class="nav-inner">
    <div class="brand">
      <img src="images/logo.png" alt="Teataimi Logo" class="brand-logo-img">
      <span class="brand-name">Teataimi</span>
    </div>

    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="menu.html">Menu</a>
      <a href="about.html">About</a>
      <a href="track.html">Track Order</a>

      <a id="nav-orders" href="order-history.html" style="display:none;">My Orders</a>
      <a id="nav-cart" href="cart.html" class="icon-btn">🛒</a>

      <a id="nav-logout" href="#" onclick="logoutUser()">
        <i class="fa-solid fa-right-from-bracket"></i>
      </a>

      <a id="nav-login" href="login.html">Login</a>
      <a id="nav-register" href="register.html">Register</a>
    </div>
  </div>
</header>


<section class="checkout-wrapper">
  <div class="checkout-card">

    <h1 class="checkout-title">Checkout</h1>

    <form id="checkout-form" class="checkout-form" onsubmit="handleCheckout(event)">

      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="cust-name" required>
      </div>

      <div class="form-group">
        <label>Phone Number</label>
        <input type="text" id="cust-phone" required>
      </div>

      <div class="form-group">
        <label>Date</label>
        <input type="date" id="order-date" required>
      </div>

      <div class="form-group">
        <label>Preferred Time</label>
        <select id="time-slot" required>
          <option>10 AM - 12 PM</option>
          <option>12 PM - 3 PM</option>
          <option>3 PM - 6 PM</option>
        </select>
      </div>

      <div class="form-group">
        <label>Delivery Option</label>
        <select id="delivery-option" required>
          <option value="Pickup">Pickup (Free)</option>
          <option value="Delivery">Delivery (RM8)</option>
        </select>
      </div>

      <!-- DELIVERY FORM -->
      <div id="delivery-address-box" class="form-group" style="display:none;">

        <label>Street Address</label>
        <input type="text" id="cust-address1">

        <div class="split-row">
          <div>
            <label>City</label>
            <input type="text" id="cust-city">
          </div>

          <div>
            <label>Postcode</label>
            <input type="text" id="cust-postcode" maxlength="5">
          </div>
        </div>

        <label>State</label>
        <select id="cust-state">
          <option value="">-- Select State --</option>

          <!-- SEMENANJUNG -->
          <option>Perlis</option>
          <option>Kedah</option>
          <option>P.Pinang</option>
          <option>Perak</option>
          <option>Selangor</option>
          <option>Kuala Lumpur</option>
          <option>Putrajaya</option>
          <option>Negeri Sembilan</option>
          <option>Melaka</option>
          <option>Johor</option>
          <option>Pahang</option>
          <option>Terengganu</option>
          <option>Kelantan</option>

          <!-- DISALLOWED -->
          <option disabled>Sabah ❌ (Not Available)</option>
          <option disabled>Sarawak ❌ (Not Available)</option>
        </select>

        <p id="stateWarning" style="display:none;color:red;font-size:14px;">
          We currently do NOT deliver to Sabah or Sarawak.
        </p>

      </div>

      <!-- PICKUP BOX -->
      <div id="pickup-address-box" class="pickup-info">
        <strong>Pickup Location:</strong><br>
        Southbay Plaza Condominium, Batu Maung
      </div>

      <div class="form-group total">
        <label>Total Amount:</label>
        <span id="totalAmount">RM0.00</span>
      </div>

      <div class="form-group">
        <label>Payment Method</label>
        <select id="payment-method" required>
          <option value="">-- Select Payment Method --</option>
          <option value="Credit/Debit Card">💳 Credit/Debit Card</option>
          <option value="FPX">🏦 Online Banking (FPX)</option>
          <option value="E-Wallet">📱 E-Wallet</option>
        </select>
      </div>

      <div id="paymentDetails" class="form-group" style="display:none;"></div>

      <button class="btn btn-primary" type="submit">Place Order</button>

    </form>
  </div>
</section>


<footer class="footer">
  <div class="copy">© 2025 Teataimi. All rights reserved.</div>
</footer>

<!-- Load auth.js FIRST so getCartKey, checkoutOrder, etc exist -->
<script src="auth.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {
  /* DELIVERY TOGGLE */
  const optionSelect = document.getElementById("delivery-option");
  const deliveryBox = document.getElementById("delivery-address-box");
  const pickupBox = document.getElementById("pickup-address-box");

  optionSelect.addEventListener("change", () => {
    deliveryBox.style.display = optionSelect.value === "Delivery" ? "block" : "none";
    pickupBox.style.display = optionSelect.value === "Pickup" ? "block" : "none";
    updateTotal();
  });

  /* DATE >= 3 DAYS */
  const dateInput = document.getElementById("order-date");
  let d = new Date();
  d.setDate(d.getDate() + 3);
  dateInput.min = d.toISOString().split("T")[0];

  /* UPDATE TOTAL */
  function updateTotal() {
    // use getCart() from auth.js to read the shared cart
    let cart = (typeof getCart === 'function') ? getCart() : (JSON.parse(localStorage.getItem('cart')) || []);
    let subtotal = cart.reduce((s, i) => s + (parseFloat(i.price) || 0) * (Number(i.quantity) || 0), 0);
    let shipping = optionSelect.value === "Delivery" ? 8 : 0;
    document.getElementById("totalAmount").textContent =
      "RM " + (subtotal + shipping).toFixed(2);
  }
  updateTotal();

  /* PAYMENT UI */
  const paymentSelect = document.getElementById("payment-method");
  const paymentDetails = document.getElementById("paymentDetails");

  paymentSelect.addEventListener("change", () => {
    let method = paymentSelect.value;
    let html = "";

    if (method === "Credit/Debit Card") {
      html = `
        <label>Card Number</label>
        <input type="text" placeholder="XXXX XXXX XXXX XXXX" required>
        <label>Expiry</label>
        <input type="month" required>
        <label>CVV</label>
        <input type="text" maxlength="4" placeholder="123" required>
      `;
    } else if (method === "FPX") {
      html = `
        <label>Select Bank</label>
        <div class="bank-options">
          <label><input type="radio" name="bank" required> <img src="images/maybank.png"></label>
          <label><input type="radio" name="bank"> <img src="images/cimb.png"></label>
          <label><input type="radio" name="bank"> <img src="images/rhb.png"></label>
          <label><input type="radio" name="bank"> <img src="images/publicbank.png"></label>
        </div>
        <p class="note">You will be redirected to FPX secure gateway.</p>
      `;
    } else if (method === "E-Wallet") {
      html = `
        <label>Choose E-Wallet</label>
        <div class="wallet-options">
          <label><input type="radio" name="wallet" required> <img src="images/tng.webp"></label>
          <label><input type="radio" name="wallet"> <img src="images/Grabpay.png"></label>
          <label><input type="radio" name="wallet"> <img src="images/shopeepay.png"></label>
        </div>
        <img src="images/fakeqr.png" class="qr-code">
      `;
    }

    paymentDetails.style.display = method ? "block" : "none";
    paymentDetails.innerHTML = html;
  });
});
</script>

</body>
</html>
