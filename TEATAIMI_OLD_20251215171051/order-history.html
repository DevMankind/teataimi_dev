<script src="auth.js"></script>
<script>
function loadOrderHistory() {
  let user = JSON.parse(localStorage.getItem("loggedInUser"));
  let orders = JSON.parse(localStorage.getItem("orders")) || [];
  let container = document.getElementById("ordersContainer");

  if (!user) return container.innerHTML = "<p>Please login to view orders.</p>";

  container.innerHTML = "";

  orders.forEach((order, realIndex) => {
    if (order.user !== user.email) return;

    container.innerHTML += `
  <div class="order-box">
    <h3>Order #${order.orderNo}</h3>

    <p><strong>Name:</strong> ${order.name}</p>
    <p><strong>Phone:</strong> ${order.phone}</p>
    <p><strong>Delivery Option:</strong> ${order.option}</p>
    <p><strong>Address:</strong> ${order.address}</p>
    <p><strong>Date:</strong> ${order.date} (${order.time})</p>
    <p><strong>Payment:</strong> ${order.payment}</p>
    <p><strong>Status:</strong> ${order.status}</p>

    <h4>Items:</h4>
    <div class="order-items">
    ${order.items.map(i => `
      <div class="order-item">
        <img src="${i.image}">
        <span>${i.name} x ${i.quantity}</span>
      </div>
    `).join("")}
    </div>

 <p class="total">
  <span>Total:</span>
  <span>
    RM${
      order.items.reduce((sum,i)=>sum+i.price*i.quantity,0) 
      + (order.option === "Delivery" ? 8 : 0)
    }
  </span>
</p>



    <div class="order-actions">
      <button onclick="reorder(${realIndex})" class="btn-sm btn-ghost">Reorder</button>
      ${order.status === "Pending"
        ? `<button onclick="cancelOrder(${realIndex})" class="btn-sm btn-danger">Cancel</button>`
        : ""
      }
    </div>
  </div>
`;

  });
}
loadOrderHistory();


/* Cancel Order */
function cancelOrder(realIndex) {
  let orders = JSON.parse(localStorage.getItem("orders")) || [];
  if (!confirm("Cancel this order?")) return;

  orders.splice(realIndex, 1);
  localStorage.setItem("orders", JSON.stringify(orders));
  loadOrderHistory();
}


/* Reorder */
function reorder(realIndex) {
  let orders = JSON.parse(localStorage.getItem("orders")) || [];
  let user = JSON.parse(localStorage.getItem("loggedInUser"));

  let cartKey = "cart_" + user.email;
  localStorage.setItem(cartKey, JSON.stringify(orders[realIndex].items));

  window.location.href = "cart.html";
}

</script>
